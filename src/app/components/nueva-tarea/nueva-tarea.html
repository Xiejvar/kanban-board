<form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="form-nueva-tarea">
  <input 
    formControlName="titulo" 
    placeholder="Título de la tarea" 
    [class.error]="formulario.get('titulo')?.invalid && formulario.get('titulo')?.touched" />

  @if (formulario.get('titulo')?.invalid && formulario.get('titulo')?.touched) {
    <span class="mensaje-error">El título debe tener al menos 3 caracteres</span>
  }

  <textarea 
    formControlName="descripcion" 
    placeholder="Descripción"></textarea>

  <select formControlName="prioridad">
    <option value="baja">Baja</option>
    <option value="media">Media</option>
    <option value="alta">Alta</option>
  </select>

  <button type="submit" [disabled]="formulario.invalid">Crear tarea</button>
</form>
